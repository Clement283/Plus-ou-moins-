<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plus ou moins · Icônes</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="theme.js"></script>
<style>
body{background:var(--bg);color:var(--on-surface);padding:32px 16px}
h1{font:700 24px var(--font-display);margin-bottom:8px} p{color:var(--muted);font-size:15px;margin-bottom:20px;max-width:64ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.it{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:7px}
.it span{font-size:11px;color:var(--subtle)}
</style>
</head>
<body>

<h1>Icônes</h1>
<p>Trait arrondi de 2, couleur héritée. Dessinées dans le style de Lucide / Material Symbols (jeux ouverts). Jamais d'emoji pour l'interface. <a class="link" href="index.html">Retour au design system</a></p>
<div class="grid" id="g"></div>
<script>
document.getElementById('g').innerHTML=[...document.querySelectorAll('symbol')].map(s=>`<div class="it"><svg class="ico ico--lg"><use href="#${s.id}"/></svg><span>${s.id}</span></div>`).join('');
</script>
</body>
</html>
