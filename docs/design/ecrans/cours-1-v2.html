<script>
const M = '−'; // vrai signe moins
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s);

/* ——— Petits morceaux réutilisables ——— */
const calc = (html, cls = '') => `<div class="calc calcbox ${cls}">${html}</div>`;
const rule = (n, text) => `<div class="rule"><b>Règle ${n}</b>${text}</div>`;
const fb = (kind, title, text = '') => `<div class="fb ${kind}"><strong>${title}</strong>${text ? `<p>${text}</p>` : ''}</div>`;

/* Écran « étapes qui apparaissent » : chaque « Suite » montre la ligne suivante, doucement. */
/* Une étape = { s: le grand calcul (« scène »), t: la phrase }. La scène reste en haut et change ; les phrases s'empilent. */
function reveal(title, steps) {
  return {
    init: () => ({ k: 1, rp: false }),
    render: (st) => {
      let scene = '', sceneAt = -1;
      steps.slice(0, st.k).forEach((s, i) => { if (s.s) { scene = s.s; sceneAt = i; } });
      const sceneHtml = scene ? `<div class="stage ${sceneAt === st.k - 1 || st.rp ? 'new' : ''}">${scene}</div>` : '';
      const texts = steps.slice(0, st.k).map((s, i) => (s.t ? `<div class="step ${i === st.k - 1 ? 'new' : ''}">${s.t}</div>` : '')).join('');
      const dots = `<div class="dots" aria-label="Étape ${st.k} sur ${steps.length}">${steps.map((_, i) => `<i class="${i < st.k ? 'on' : ''}"></i>`).join('')}</div>`;
      return `<h2 class="t">${title}</h2>${sceneHtml}${dots}<div class="texts">${texts}</div><div class="zone"><button class="btn btn-line btn-sm" data-a="replay">↻ Revoir cette étape</button></div>`;
    },
    foot: (st) => (st.k < steps.length ? { label: 'Suite', a: 'more' } : { label: 'Suivant', a: 'next' }),
    on: (a, d, st) => { if (a === 'more') { st.k++; st.rp = false; } if (a === 'replay') st.rp = true; },
  };
}

/* Écran de questions à toucher (une ou plusieurs, l'une après l'autre). */
function quiz(items, opts = {}) {
  const optsHtml = (it, qi, a) => `<div class="opts ${it.row ? 'row' : ''}">${it.o.map((o, oi) => {
    let c = '';
    if (a !== undefined) { if (oi === it.ok) c = 'ok'; else if (oi === a) c = 'ko'; }
    return `<button class="opt ${it.big ? 'big' : ''} ${c}" data-a="pick" data-q="${qi}" data-o="${oi}" ${a !== undefined ? 'disabled' : ''}>${o}</button>`;
  }).join('')}</div>`;
  const feedback = (it, a) => {
    const good = a === it.ok;
    const why = (it.why && it.why[a]) || (good ? it.yes : it.no) || '';
    return good ? fb('ok', it.yesTitle || 'Juste !', why) : fb(it.guess ? 'info' : 'ko', it.guess ? (it.noTitle || 'Pas tout à fait, et c\'est normal.') : 'Pas tout à fait.', why);
  };
  return {
    init: () => ({ ans: [] }),
    render: (st) => {
      const cur = Math.min(st.ans.length, items.length - 1);
      let h = opts.top || '';
      items.forEach((it, qi) => {
        if (qi > cur) return;
        const a = st.ans[qi];
        h += `<div class="step ${qi === cur ? 'new' : ''}">`;
        if (it.calc) h += calc(it.calc, 'md');
        h += `<p class="q">${it.q}</p>`;
        if (qi < cur) h += `<p class="small">Ta réponse : ${it.o[a]} ${a === it.ok ? '✓' : '✗'}</p>`;
        else if (a !== undefined) h += feedback(it, a);
        h += '</div>';
      });
      if (st.ans.length === items.length && opts.after) h += `<div class="step new">${opts.after}</div>`;
      if (opts.free) h += `<p class="free">Question pour découvrir : elle ne compte pas dans la note.</p>`;
      h += `<div class="zone">${optsHtml(items[cur], cur, st.ans[cur])}</div>`;
      return h;
    },
    foot: (st) => (st.ans.length === items.length ? { label: 'Continuer', a: 'next' } : { label: 'Continuer', a: 'next', off: true }),
    on: (a, d, st) => { if (a === 'pick' && +d.q === st.ans.length) st.ans.push(+d.o); },
  };
}

/* Saisie au clavier complet. */
const KEYS = ['7','8','9','÷','4','5','6','×','1','2','3',M,'(','0',')','+'];
const pretty = (s) => s.replace(/([+×÷=])/g, ' $1 ').replace(/(\d|\))−/g, '$1 − ').replace(/\s+/g, ' ').trim();
function typed({ consigne, given, check, steps, lines, hint = 'Tape le résultat avec les touches du clavier.' }) {
  return {
    init: () => ({ v: '', res: null }),
    render: (st) => {
      const cls = st.res ? (st.res.ok ? 'ok' : 'ko') : '';
      let h = `<p class="lead">${consigne}</p>${calc(given, 'md')}
        <p class="small">${hint}</p>

/* ——— Cours 1 : la droite graduée (scène SVG) et les nombres colorés ——— */
const neg = (n) => `<span class="neg">${M}${n}</span>`;
const pos = (n) => `<span class="pos">${n}</span>`;
const fmt = (v) => (v < 0 ? M + Math.abs(v) : String(v));
const fmtS = (v) => (v < 0 ? M + Math.abs(v) : '+' + v);
const scene = (inner, cls = '') => `<div class="stage ${cls}">${inner}</div>`;
const sc = (svg, calcHtml = '', cap = '') => `${svg}${calcHtml ? `<div class="sc-calc">${calcHtml}</div>` : ''}${cap ? `<span class="cap">${cap}</span>` : ''}`;

/* Droite graduée. jumps = [{a, b}] (bonds de a vers b) ; anim = indice du bond qui s'anime ;
   neutral = aucune couleur de signe (pendant une question) ; labels = 'signed' | 'abs' | 'none' | 'q' ;
   mark = graduations surlignées en jaune ; start / end = départ et arrivée. */
function line({ from = -10, to = 2, jumps = [], anim = -1, neutral = false, labels = 'signed', mark = [], start = null, end = null, caps = false }) {
  const W = 340, P = 18, Y = 80;
  const X = (v) => P + ((v - from) / (to - from)) * (W - 2 * P);
  const every = to - from > 15 ? 2 : 1;
  const tone = (v) => (neutral ? 'muted' : v < 0 ? 'neg' : v > 0 ? 'pos' : 'ink');
  let s = `<svg class="nl" viewBox="0 0 ${W} 140" role="img" aria-label="Droite graduée de ${fmt(from)} à ${fmt(to)}">`;
  if (!neutral && from < 0 && to > 0) {
    s += `<line class="ax neg" x1="8" y1="${Y}" x2="${X(0)}" y2="${Y}"/><line class="ax pos" x1="${X(0)}" y1="${Y}" x2="${W - 8}" y2="${Y}"/>`;
  } else s += `<line class="ax muted" x1="8" y1="${Y}" x2="${W - 8}" y2="${Y}"/>`;
  const marks = end !== null ? [...mark, end] : mark;
  for (let v = from; v <= to; v++) {
    const x = X(v), z = v === 0;
    s += `<line class="tk ${tone(v)}" x1="${x}" y1="${Y - (z ? 9 : 6)}" x2="${x}" y2="${Y + (z ? 9 : 6)}" ${z ? 'style="stroke-width:3.5"' : ''}/>`;
    const hl = marks.includes(v);
    if (hl) s += `<rect x="${x - 14}" y="${Y + 11}" width="28" height="22" rx="6" fill="var(--hl)"/>`;
    if (hl || z || (v - from) % every === 0) s += `<text class="${hl ? 'hlink' : tone(v)}" x="${x}" y="${Y + 27}" ${z || hl ? 'style="font-weight:700"' : ''}>${fmt(v)}</text>`;
  }
  jumps.forEach((j, i) => {
    const x1 = X(j.a), x2 = X(j.b), h = Math.min(52, 16 + Math.abs(j.b - j.a) * 5), c = h * 1.33;
    const t = neutral ? 'muted' : j.b < j.a ? 'neg' : 'pos', an = i === anim ? 'anim' : '', d = `style="--d:${i === anim ? 0 : 0}s"`;
    s += `<path class="arc ${t} ${an}" ${d} pathLength="1" stroke-dasharray="1" d="M ${x1} ${Y} C ${x1} ${Y - c}, ${x2} ${Y - c}, ${x2} ${Y}"/>`;
    s += `<polygon class="head ${t} ${an ? 'anim fade' : ''}" points="${x2 - 6},${Y - 11} ${x2 + 6},${Y - 11} ${x2},${Y - 1}"/>`;
    if (labels !== 'none') {
      const txt = labels === 'abs' ? Math.abs(j.b - j.a) : labels === 'q' ? '?' : fmtS(j.b - j.a);
      s += `<text class="lab ${t} ${an ? 'anim fade' : ''}" x="${(x1 + x2) / 2}" y="${Y - h - 7}">${txt}</text>`;
    }
  });
  if (start !== null) s += `<circle cx="${X(start)}" cy="${Y}" r="6" fill="var(--ink)"/>`;
  if (end !== null) s += `<circle cx="${X(end)}" cy="${Y}" r="6" fill="var(--hl)" stroke="var(--ink)" stroke-width="2"/>`;
  if (caps && start !== null) s += `<text class="cp muted" x="${X(start)}" y="${Y + 54}">départ</text>`;
  if (caps && end !== null && start !== null && Math.abs(end - start) >= 3) s += `<text class="cp muted" x="${X(end)}" y="${Y + 54}">arrivée</text>`;
  return s + '</svg>';
}

/* Exemple guidé à cases : chaque case est une petite réponse tapée, dans l'ordre. */
const num = (v) => { const s = v.replace(/\s/g, '').replace(/−/g, '-'); return /^-?\d+$/.test(s) ? Number(s) : NaN; };
function trous({ consigne, given, lines }) {
  return {
    init: () => ({ i: 0, v: '', res: null, vals: [] }),
    render: (st) => {
      const L = lines;
      let eq = '';
      L.forEach((l, i) => {
        if (i > st.i) return;
        let b;
        if (i < st.i) b = `<span class="blank done">${l.exp}</span>`;
        else if (st.res) b = `<span class="blank ${st.res.ok ? 'ok' : 'ko'}">${pretty(st.v)}</span>`;
        else b = `<span class="blank">${pretty(st.v) || '▢'}${'<span class="caret"></span>'}</span>`;
        eq += `<div class="${i === st.i ? 'step new' : ''}">${l.html(b)}</div>`;
      });
      let h = `<p class="lead">${consigne}</p>${calc(given, 'md')}<div class="calcbox eqs">${eq}</div>`;
      if (st.res) h += st.res.ok ? fb('ok', 'Juste !', st.res.msg) : fb('ko', 'Pas tout à fait.', `${st.res.msg} La bonne réponse : <b>${L[st.i].exp}</b>.`);
      else h += `<p class="small">Tape ce qui manque dans la case, avec les touches du clavier.</p><div class="zone"><div class="keys">${KEYS.map((k) => `<button class="key ${/\d/.test(k) ? '' : 'op'}" data-a="key" data-k="${k}">${k}</button>`).join('')}<button class="key op" data-a="del" style="grid-column:span 4">⌫ Effacer</button></div></div>`;
      return h;
    },
    foot: (st) => (st.res ? { label: st.i < lines.length - 1 ? 'Case suivante' : 'Continuer', a: st.i < lines.length - 1 ? 'adv' : 'next' } : { label: 'Valider', a: 'check', off: !st.v }),
    on: (a, d, st) => {
      if (a === 'key') st.v += d.k;
      if (a === 'del') st.v = st.v.slice(0, -1);
      if (a === 'check') st.res = lines[st.i].check(num(st.v));
      if (a === 'adv') { st.i++; st.v = ''; st.res = null; }
    },
  };
}

/* Étiquettes à ordonner */
const ORD = ['Les deux sont négatifs', '2 + 7 = 9', `Je garde le signe ${M}`, `Résultat : ${M}9`];
const ORD_SHOW = [2, 0, 3, 1];
const ORD_MSG = [
  'On commence par regarder les signes : ils décident de la méthode.',
  'Ensuite, on additionne les nombres sans leur signe : 2 + 7 = 9.',
  `Seulement après, on remet le signe : je garde le signe ${M}.`,
  `Le résultat vient en dernier : ${M}9.`,
];
add({ id: 'ordre', sec: 'À toi', name: 'Remettre dans l\'ordre',
  what: "Quatre étapes de la résolution de −2 + (−7) sont mélangées. Elle les touche dans l'ordre, de la première à la dernière ; toucher une étape placée la retire. Après Valider, chaque case est verte ou rouge et le message explique la première erreur.",
  why: "Ça lui fait raconter la méthode avec ses mots à elle, dans l'ordre. Les étapes sont en bas, les cases en haut, et la manière de répondre est dans la consigne.",
  ask: ["Le doc 06 parle d'« étiquettes à ordonner ». Je propose de les toucher dans l'ordre (plus sûr au doigt). Ou les faire glisser comme dans « Classer » du Cours 0 ?"] },
  { init: () => ({ pick: [], done: false }),
    render: (st) => {
      let h = `<p class="lead"><b>Remets les étapes dans l'ordre</b> pour résoudre ce calcul. Touche-les en bas, de la première à la dernière.</p>${calc(`${M}2 + (${M}7)`, 'md')}
        <p class="small">Pour retirer une étape, touche-la dans la liste.</p><div class="slots">`;
      for (let p = 0; p < 4; p++) {
        const k = st.pick[p];
        const c = st.done ? (k === p ? 'ok' : 'ko') : '';
        h += `<button class="slot ${k !== undefined ? 'full' : ''} ${c}" data-a="unpick" data-p="${p}" ${st.done ? 'disabled' : ''}><span class="sn">${p + 1}</span>${k !== undefined ? ORD[k] : ''}</button>`;
      }
      h += '</div>';
      if (st.done) {
        const w = st.pick.findIndex((k, p) => k !== p);
        h += w === -1 ? fb('ok', 'Voici le bon ordre.', 'Tu as bien suivi la méthode.') : fb('ko', 'Pas tout à fait.', `${ORD_MSG[w]} Le bon ordre : ${ORD.map((o, i) => `${i + 1}. ${o}`).join(' · ')}`);
      } else {
        h += `<div class="zone"><p class="small">À ranger :</p><div class="tags">${ORD_SHOW.filter((k) => !st.pick.includes(k)).map((k) => `<button class="etq" data-a="pick" data-k="${k}">${ORD[k]}</button>`).join('')}</div></div>`;
      }
      return h;
    },
    foot: (st) => (st.done ? { label: 'Continuer', a: 'next' } : { label: 'Valider', a: 'check', off: st.pick.length < 4 }),
    on: (a, d, st) => {
      if (st.done) return;
      if (a === 'pick' && st.pick.length < 4) st.pick.push(+d.k);
      if (a === 'unpick') st.pick.splice(+d.p, 1);
      if (a === 'check') st.done = true;
    } });

add({ id: 'guide-2', sec: 'Exemple guidé 2 sur 2', name: 'Calculer −6 + (−1)',
  what: "Le calcul reste affiché. Cette fois elle tape le résultat entier, sans cases pour l'aider. Clavier complet. Si elle se trompe, « Étape par étape » montre trois vraies étapes.",
  why: "Le premier exemple guidait chaque étape. Celui-ci la laisse faire seule, mais avec un filet. Le cas −6 + (−1) contient un 1 : la soustraction donnerait −5, et c'est le piège à voir.",
  ask: ["Le doc 06 avait deux exemples à cases. J'ai changé le deuxième en réponse tapée seule, plus proche des exercices de fin. Tu valides ?",

<li><b>Les exemples guidés</b> montrent le calcul de départ et demandent une vraie action. Le clavier complet ne dicte pas la réponse.</li>
<li><b>La fin annonce l'enjeu</b>, et le résultat explique avec des chiffres ce qui a manqué.</li>
</ul></section>
<section><h3>Règle des couleurs</h3><div class="legend">
<div><span class="sw" style="background:var(--hl)"></span><span><b>Surligneur jaune</b> = « regarde ici ». Uniquement dans les explications.</span></div>
<div><span class="sw" style="background:var(--neg)"></span><span><b>Orange</b> = nombre négatif, <b>dans les explications seulement</b>.</span></div>
<div><span class="sw" style="background:var(--pos)"></span><span><b>Bleu</b> = nombre positif, <b>dans les explications seulement</b>.</span></div>
<div><span class="sw" style="background:var(--ok-bg);border-color:var(--ok)"></span><span><b>Vert</b> = juste, <b>après</b> une réponse.</span></div>
<div><span class="sw" style="background:var(--ko-bg);border-color:var(--ko)"></span><span><b>Rouge</b> = faux, <b>après</b> une réponse. Jamais pour un nombre négatif.</span></div>
<div><span class="sw" style="background:var(--surface)"></span><span><b>Pendant une question : aucune couleur qui donne un indice.</b> La droite graduée devient grise.</span></div>
</div></section>`;

/* ——— Moteur ——— */
let idx = 0;
const states = S.map((s) => s.init());

function renderNav() {
  $('#nav').innerHTML = S.map((s, i) => `<button class="${i === idx ? 'on' : ''}" data-go="${i}">${i + 1}. ${s.name}</button>`).join('');
}
function chipText(s, i) {
  if (s.sec === 'Leçon') {
    const lec = S.filter((x) => x.sec === 'Leçon');
    return `Cours 1 · Leçon · étape ${lec.indexOf(s) + 1} sur ${lec.length}`;
  }
  return `Cours 1 · ${s.sec}`;
}
function render() {
  const s = S[idx], st = states[idx];
  const f = s.foot(st);
  $('#phone').innerHTML = `
    <div class="ph-top"><span class="ph-x" aria-hidden="true">✕</span><div class="bar">${S.map((_, i) => `<i class="${i < idx ? 'd' : i === idx ? 'c' : ''}"></i>`).join('')}</div></div>
    <span class="chip">${chipText(s, idx)}</span>
    <div class="ph-body">${s.render(st)}</div>
    <div class="ph-foot"><button class="btn btn-main" data-a="${f.a}" ${f.off ? 'disabled' : ''}>${f.label}</button></div>`;
  const ask = s.ask.length ? `<section class="ask"><h3>À décider</h3><ul>${s.ask.map((a) => `<li>${a}</li>`).join('')}</ul></section>` : '';
  $('#notes').innerHTML = `
    <section><h3>Écran ${idx + 1} sur ${S.length} · ${s.name}</h3><p>${s.what}</p><p><b>Pourquoi :</b> ${s.why}</p>
      <div class="pager"><button data-go="${Math.max(0, idx - 1)}">← Écran précédent</button><button data-go="${Math.min(S.length - 1, idx + 1)}">Écran suivant →</button><button data-reset>Recommencer l'écran</button></div></section>
    ${ask}${GLOBAL}`;
  renderNav();
}
function go(i) { idx = i; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

document.addEventListener('click', (e) => {
  const g = e.target.closest('[data-go]');
  if (g) return go(+g.dataset.go);
  if (e.target.closest('[data-reset]')) { states[idx] = S[idx].init(); return render(); }
  if (e.target.closest('[data-drag]')) return; // géré par le glisser-déposer
  const el = e.target.closest('#phone [data-a]');
  if (!el || el.disabled) return;
  const a = el.dataset.a;
  if (a === 'next') return go(Math.min(S.length - 1, idx + 1));
  if (a === 'home') { S.forEach((s, i) => (states[i] = s.init())); return go(0); }
  S[idx].on(a, el.dataset, states[idx]);
  render();
});

/* Glisser-déposer (pointeur) avec repli au toucher */
let drag = null;
document.addEventListener('pointerdown', (e) => {
  const t = e.target.closest('[data-drag]');
  if (!t || states[idx].done) return;
  drag = { i: t.dataset.drag, x: e.clientX, y: e.clientY, el: t, ghost: null };
});
document.addEventListener('pointermove', (e) => {
  if (!drag) return;
  if (!drag.ghost && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 8) {
    drag.ghost = drag.el.cloneNode(true); drag.ghost.classList.add('ghost'); document.body.appendChild(drag.ghost);
    drag.el.style.opacity = '.3';
  }
  if (drag.ghost) {
    drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px';
    document.querySelectorAll('.bin').forEach((b) => b.classList.remove('over'));
    const under = document.elementFromPoint(e.clientX, e.clientY)?.closest('.bin');
    if (under) under.classList.add('over');
  }
});
document.addEventListener('pointerup', (e) => {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.ghost) {
    d.ghost.remove();
    const under = document.elementFromPoint(e.clientX, e.clientY)?.closest('.bin');
    if (under) S[idx].on('dragdrop', { i: d.i, k: under.dataset.bin }, states[idx]);
  } else {
    S[idx].on('tap', { i: d.i }, states[idx]);
  }
  render();
});
document.addEventListener('pointercancel', () => { if (drag?.ghost) drag.ghost.remove(); drag = null; render(); });

render();
</script>
