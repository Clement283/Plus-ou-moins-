<title>Nouveau Cours 0</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Mise en page : un téléphone qui déroule le cours, à côté les notes de conception de l'écran affiché. */
:root{
  --bg:#F2F3F8; --surface:#FFFFFF; --sunken:#E9EBF3; --line:#DDE0EA;
  --ink:#1A1D2E; --muted:#565C73; --primary:#3B39D4; --on-primary:#FFFFFF;
  --ok:#137F57; --ok-bg:#DDF3E9; --ko:#C42D47; --ko-bg:#FCE4E8;
  --hl:#FFE27A; --hl-ink:#5C4100; --grey-bg:#ECEDF2;
  --font:'Lexend','Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10121A; --surface:#1B1E2B; --sunken:#252839; --line:#2E3247;
  --ink:#ECEDF5; --muted:#A5AAC2; --primary:#8D8CF7; --on-primary:#12132A;
  --ok:#62D6A5; --ok-bg:#15392B; --ko:#FF8296; --ko-bg:#45202A;
  --hl:#5A4A12; --hl-ink:#FFE38C; --grey-bg:#262A3A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10121A; --surface:#1B1E2B; --sunken:#252839; --line:#2E3247;
  --ink:#ECEDF5; --muted:#A5AAC2; --primary:#8D8CF7; --on-primary:#12132A;
  --ok:#62D6A5; --ok-bg:#15392B; --ko:#FF8296; --ko-bg:#45202A;
  --hl:#5A4A12; --hl-ink:#FFE38C; --grey-bg:#262A3A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1100px;margin:0 auto;display:grid;gap:24px}
.intro h1{font-size:1.6rem;margin:0 0 4px;text-wrap:balance}
.intro p{margin:0;color:var(--muted);max-width:70ch}
.layout{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:minmax(0,1fr)}}

/* ——— Liste des écrans ——— */
.nav{display:flex;flex-wrap:wrap;gap:6px}
.nav button{font:inherit;font-size:.8rem;border:1px solid var(--line);background:var(--surface);color:var(--muted);
  border-radius:999px;padding:4px 10px;cursor:pointer}
.nav button.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}

/* ——— Téléphone ——— */
.phone{background:var(--surface);border:1px solid var(--line);border-radius:28px;min-height:720px;display:flex;flex-direction:column;overflow:hidden;position:relative}
.ph-top{display:flex;align-items:center;gap:12px;padding:16px 18px 6px}
.ph-x{font-size:1.4rem;color:var(--muted);line-height:1}
.bar{flex:1;display:flex;gap:3px}
.bar i{flex:1;height:5px;border-radius:3px;background:var(--sunken)}
.bar i.d{background:var(--primary)}
.bar i.c{background:color-mix(in srgb,var(--primary) 45%,var(--sunken))}
.chip{margin:8px 18px 0;align-self:flex-start;font-size:.8rem;font-weight:600;color:var(--muted);background:var(--sunken);border-radius:999px;padding:5px 12px}
.ph-body{flex:1;padding:14px 20px 8px;display:flex;flex-direction:column;gap:14px}
.ph-foot{padding:10px 20px 20px;display:grid;gap:8px}
h2.t{font-size:1.45rem;line-height:1.25;margin:0;text-wrap:balance}
.lead{margin:0}
.small{font-size:.85rem;color:var(--muted);margin:0}
.btn{font:inherit;font-weight:600;font-size:1.05rem;border-radius:16px;padding:15px;border:0;cursor:pointer;width:100%}
.btn-main{background:var(--primary);color:var(--on-primary)}
.btn-main:disabled{background:var(--sunken);color:var(--muted);cursor:default}
.btn-line{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn:focus-visible,.opt:focus-visible,.key:focus-visible,.g:focus-visible,.tag:focus-visible{outline:3px solid var(--primary);outline-offset:2px}

/* Calculs */
.calc{font-size:2.2rem;font-weight:500;text-align:center;letter-spacing:.02em;padding:14px 8px;white-space:nowrap}
.calc.md{font-size:1.6rem;padding:8px}
.calcbox{background:var(--sunken);border-radius:18px}
.hl{background:var(--hl);color:var(--hl-ink);border-radius:8px;padding:0 .1em}
.lbl{display:block;font-size:.75rem;font-weight:600;color:var(--hl-ink);background:var(--hl);border-radius:6px;padding:2px 8px;width:max-content;margin:4px auto 0}

/* Étapes qui apparaissent */
.step{display:grid;gap:8px}
.new{animation:up .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}
.new .pin{display:inline-block;animation:pin .7s .35s cubic-bezier(.34,1.4,.5,1) both}
@keyframes pin{from{opacity:0;transform:scale(2.2)}to{opacity:1;transform:none}}
.new .bump{display:inline-block;animation:bump .6s .3s ease both}
@keyframes bump{0%,100%{transform:none}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.new .slide{display:inline-block;animation:slide .8s .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes slide{from{transform:translateX(1.4em);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.new,.new .pin,.new .bump,.new .slide{animation:none}}

.stage{background:var(--sunken);border-radius:22px;min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px 10px;font-size:2.6rem;font-weight:500;white-space:nowrap}
.stage .lbl{font-size:.8rem}
.stage .cap{font-size:.85rem;font-weight:500;color:var(--muted);white-space:normal;text-align:center}
.stage.split{flex-direction:row;justify-content:space-around;font-size:2.1rem}
.stage.split > div{display:flex;flex-direction:column;align-items:center;gap:4px}
.stage .pairs{display:grid;gap:10px;font-size:1.35rem;width:100%}
.stage .pairs .pair{font-size:1.35rem}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--primary)}
.texts{display:grid;gap:10px}
.texts .step:not(.new) .lead{color:var(--muted)}
.rule{border:2px solid var(--primary);border-radius:16px;padding:12px 14px}
.rule b{display:block;color:var(--primary);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.pair{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;font-size:1.3rem;text-align:center}
.pair .arrow{color:var(--muted);font-size:1rem}
.tagw{font-size:.75rem;font-weight:600;color:var(--muted);display:block}

/* Choix */
.q{font-weight:600;margin:0}
.opts{display:grid;gap:8px}
.opts.row{grid-template-columns:1fr 1fr}
.opt{font:inherit;font-size:1.05rem;text-align:center;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:13px;cursor:pointer}
.opt.big{font-size:1.6rem;padding:10px}
.opt.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opt.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.opt:disabled{cursor:default}
.fb{border-radius:14px;padding:12px 14px;display:grid;gap:4px}
.fb.ok{background:var(--ok-bg)} .fb.ko{background:var(--ko-bg)} .fb.info{background:var(--sunken)}
.fb strong{color:var(--ok)} .fb.ko strong{color:var(--ko)} .fb.info strong{color:var(--ink)}
.fb p{margin:0}
.free{font-size:.75rem;color:var(--muted);text-align:center;margin:0}

/* Classer */
.tags{display:flex;flex-wrap:wrap;gap:8px;min-height:52px}
.tag{font:inherit;font-size:1.3rem;font-weight:500;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:6px 14px;cursor:grab;touch-action:none;user-select:none;white-space:nowrap}
.tag.sel{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 30%,transparent)}
.tag.ok{border-color:var(--ok);background:var(--ok-bg)} .tag.ko{border-color:var(--ko);background:var(--ko-bg)}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bin{border:2px dashed var(--line);border-radius:16px;padding:10px;min-height:170px;display:flex;flex-direction:column;gap:8px}
.bin.over{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 8%,transparent)}
.bin h3{margin:0;font-size:.95rem}
.ghost{position:fixed;pointer-events:none;z-index:50;transform:translate(-50%,-50%) scale(1.05);box-shadow:0 10px 30px rgb(0 0 0/.25)}
.fix{font-size:.85rem;color:var(--muted);display:block}

/* Clavier */
.field{font-size:1.9rem;font-weight:500;text-align:center;min-height:68px;border:2px solid var(--primary);border-radius:16px;display:flex;align-items:center;justify-content:center;white-space:nowrap;padding:0 8px}
.field.ok{border-color:var(--ok);background:var(--ok-bg)} .field.ko{border-color:var(--ko);background:var(--ko-bg)}
.field .caret{display:inline-block;width:2px;height:1.2em;background:var(--primary);margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.key{font:inherit;font-size:1.3rem;font-weight:500;border:0;border-radius:12px;padding:11px 0;background:var(--sunken);color:var(--ink);cursor:pointer}
.key.op{background:color-mix(in srgb,var(--primary) 16%,var(--sunken))}
.steps{margin:0;padding-left:1.2em;display:grid;gap:4px}

/* Exercice de fin : calcul touchable sans cases */
.glyphs{display:flex;justify-content:center;align-items:center;gap:2px;font-size:2.3rem;font-weight:500;padding:18px 0}
.g{font:inherit;border:0;background:none;color:var(--ink);padding:2px 5px;border-radius:8px;cursor:pointer;border-bottom:3px solid transparent}
.g.sp{margin-left:.35em}
.g:hover{border-bottom-color:var(--line)}
.g.ok{background:var(--ok-bg);color:var(--ok)} .g.ko{background:var(--ko-bg);color:var(--ko)}

.pieces{display:flex;justify-content:center;flex-wrap:wrap;gap:6px}
.piece{font:inherit;font-size:1.6rem;font-weight:500;min-width:46px;height:56px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;cursor:pointer}
.piece:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.piece.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)} .piece.ko{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.zone{margin-top:auto;display:grid;gap:10px;padding-top:6px}
/* Résultat */
.cond{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start;border-radius:14px;padding:12px}
.cond.ok{background:var(--ok-bg)} .cond.ko{background:var(--ko-bg)}
.cond .ic{font-weight:700} .cond.ok .ic{color:var(--ok)} .cond.ko .ic{color:var(--ko)}
.cond p{margin:0}
.errs{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.errs li{display:flex;justify-content:space-between;gap:8px;background:var(--sunken);border-radius:12px;padding:8px 12px}
.link{color:var(--primary);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.card{border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:8px}
.num{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--ko-bg);color:var(--ko);font-weight:700;font-size:1.2rem}
.recap{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.recap li{display:grid;gap:2px;background:var(--sunken);border-radius:14px;padding:10px 12px}
.recap em{font-style:normal;color:var(--muted);font-size:.9rem}
.inutile{display:inline-block;font-size:.72rem;font-weight:600;background:var(--grey-bg);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;vertical-align:middle}

/* ——— Notes ——— */
.notes{display:grid;gap:16px;min-width:0}
.notes section{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.notes h3{margin:0 0 6px;font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.notes p,.notes li{margin:0 0 6px;max-width:68ch}
.notes ul{margin:0;padding-left:1.1em}
.notes .ask{border-color:var(--primary)}
.notes .ask h3{color:var(--primary)}
.legend{display:grid;gap:8px}
.legend div{display:flex;gap:10px;align-items:center}
.sw{width:28px;height:20px;border-radius:6px;flex:none;border:1px solid var(--line)}
.pager{display:flex;gap:8px}
.pager button{font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:6px 12px;cursor:pointer}
</style>

<div class="wrap">
  <header class="intro">
    <h1>Nouveau Cours 0 : « Bien écrire un calcul »</h1>
    <p>Maquette du déroulé, écran par écran. Le style viendra plus tard : ici on juge le contenu, l'ordre, les phrases et les interactions. Tout est cliquable. À droite, ce que fait chaque écran, pourquoi, et ce qui reste à décider.</p>
  </header>
  <nav class="nav" id="nav" aria-label="Écrans du cours"></nav>
  <div class="layout">
    <div>
      <div class="phone" id="phone"></div>
    </div>
    <aside class="notes" id="notes"></aside>
  </div>
</div>

<script>
const M = '−'; // vrai signe moins
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s);

/* ——— Petits morceaux réutilisables ——— */
const calc = (html, cls = '') => `<div class="calc calcbox ${cls}">${html}</div>`;
const rule = (n, text) => `<div class="rule"><b>Règle ${n}</b>${text}</div>`;
const fb = (kind, title, text = '') => `<div class="fb ${kind}"><strong>${title}</strong>${text ? `<p>${text}</p>` : ''}</div>`;

/* Écran « étapes qui apparaissent » : chaque « Suite » montre la ligne suivante, doucement. */
/* Une étape = { s: le grand calcul (« scène »), t: la phrase }. La scène reste en haut et change ; les phrases s'empilent. */
function reveal(title, steps) {
  return {
    init: () => ({ k: 1 }),
    render: (st) => {
      let scene = '', sceneAt = -1;
      steps.slice(0, st.k).forEach((s, i) => { if (s.s) { scene = s.s; sceneAt = i; } });
      const sceneHtml = scene ? `<div class="stage ${sceneAt === st.k - 1 ? 'new' : ''}">${scene}</div>` : '';
      const texts = steps.slice(0, st.k).map((s, i) => (s.t ? `<div class="step ${i === st.k - 1 ? 'new' : ''}">${s.t}</div>` : '')).join('');
      const dots = `<div class="dots" aria-label="Étape ${st.k} sur ${steps.length}">${steps.map((_, i) => `<i class="${i < st.k ? 'on' : ''}"></i>`).join('')}</div>`;
      return `<h2 class="t">${title}</h2>${sceneHtml}${dots}<div class="texts">${texts}</div>`;
    },
    foot: (st) => (st.k < steps.length ? { label: 'Suite', a: 'more' } : { label: 'Suivant', a: 'next' }),
    on: (a, d, st) => { if (a === 'more') st.k++; },
  };
}

/* Écran de questions à toucher (une ou plusieurs, l'une après l'autre). */
function quiz(items, opts = {}) {
  const optsHtml = (it, qi, a) => `<div class="opts ${it.row ? 'row' : ''}">${it.o.map((o, oi) => {
    let c = '';
    if (a !== undefined) { if (oi === it.ok) c = 'ok'; else if (oi === a) c = 'ko'; }
    return `<button class="opt ${it.big ? 'big' : ''} ${c}" data-a="pick" data-q="${qi}" data-o="${oi}" ${a !== undefined ? 'disabled' : ''}>${o}</button>`;
  }).join('')}</div>`;
  const feedback = (it, a) => {
    const good = a === it.ok;
    const why = (it.why && it.why[a]) || (good ? it.yes : it.no) || '';
    return good ? fb('ok', it.yesTitle || 'Juste !', why) : fb(it.guess ? 'info' : 'ko', it.guess ? (it.noTitle || 'Pas tout à fait, et c\'est normal.') : 'Pas tout à fait.', why);
  };
  return {
    init: () => ({ ans: [] }),
    render: (st) => {
      const cur = Math.min(st.ans.length, items.length - 1);
      let h = opts.top || '';
      items.forEach((it, qi) => {
        if (qi > cur) return;
        const a = st.ans[qi];
        h += `<div class="step ${qi === cur ? 'new' : ''}">`;
        if (it.calc) h += calc(it.calc, 'md');
        h += `<p class="q">${it.q}</p>`;
        if (qi < cur) h += `<p class="small">Ta réponse : ${it.o[a]} ${a === it.ok ? '✓' : '✗'}</p>`;
        else if (a !== undefined) h += feedback(it, a);
        h += '</div>';
      });
      if (st.ans.length === items.length && opts.after) h += `<div class="step new">${opts.after}</div>`;
      if (opts.free) h += `<p class="free">Question pour découvrir : elle ne compte pas dans la note.</p>`;
      h += `<div class="zone">${optsHtml(items[cur], cur, st.ans[cur])}</div>`;
      return h;
    },
    foot: (st) => (st.ans.length === items.length ? { label: 'Continuer', a: 'next' } : { label: 'Continuer', a: 'next', off: true }),
    on: (a, d, st) => { if (a === 'pick' && +d.q === st.ans.length) st.ans.push(+d.o); },
  };
}

/* Saisie au clavier complet. */
const KEYS = ['7','8','9','÷','4','5','6','×','1','2','3',M,'(','0',')','+'];
const pretty = (s) => s.replace(/([+×÷=])/g, ' $1 ').replace(/(\d|\))−/g, '$1 − ').replace(/\s+/g, ' ').trim();
function typed({ consigne, given, expected, check, steps }) {
  return {
    init: () => ({ v: '', res: null }),
    render: (st) => {
      const cls = st.res ? (st.res.ok ? 'ok' : 'ko') : '';
      let h = `<p class="lead">${consigne}</p>${calc(given, 'md')}
        <p class="small">Écris le calcul en entier, avec les touches du clavier.</p>
        <div class="field ${cls}" aria-live="polite">${pretty(st.v) || ''}${st.res ? '' : '<span class="caret"></span>'}</div>`;
      if (st.res) {
        h += st.res.ok ? fb('ok', st.res.title || 'Juste !', st.res.msg) : fb('ko', 'Pas tout à fait.', st.res.msg);
        if (!st.res.ok) h += `<div class="fb info"><strong>Étape par étape</strong><ol class="steps">${steps.map((s) => `<li>${s}</li>`).join('')}</ol></div>`;
      } else {
        h += `<div class="zone"><div class="keys">${KEYS.map((k) => `<button class="key ${/\d/.test(k) ? '' : 'op'}" data-a="key" data-k="${k}">${k}</button>`).join('')}
          <button class="key op" data-a="del" style="grid-column:span 4">⌫ Effacer</button></div></div>`;
      }
      return h;
    },
    foot: (st) => (st.res ? { label: 'Continuer', a: 'next' } : { label: 'Valider', a: 'check', off: !st.v }),
    on: (a, d, st) => {
      if (a === 'key') st.v += d.k;
      if (a === 'del') st.v = st.v.slice(0, -1);
      if (a === 'check') st.res = check(st.v);
    },
  };
}

/* ——— Les écrans ——— */
const S = [];
const add = (meta, def) => S.push({ ...meta, ...def });

add({ id: 'accroche', sec: 'Leçon', name: 'Accroche',
  what: "Présente le cours en deux phrases, puis pose une question pour deviner : « 4 × −3 est-il bien écrit ? ».",
  why: "Elle sait pourquoi ce cours existe avant de commencer. Deviner donne envie de lire la suite. Une mauvaise réponse est accueillie comme normale.",
  ask: ["Les questions « pour découvrir » ne comptent pas dans la note. C'est ma proposition, d'accord ?"] },
  quiz([{ q: 'Pour commencer, à ton avis : ce calcul est-il bien écrit ?', calc: `4 × ${M}3`, o: ['Oui', 'Non'], ok: 1, row: true, guess: true,
    yes: "Il lui manque quelque chose. Tu vas voir quoi, et surtout pourquoi.",
    no: "Il est mal écrit. Ce n'est pas grave de ne pas le savoir encore : c'est justement ce que ce cours explique." }],
    { free: true, top: `<h2 class="t">Bien écrire un calcul</h2><p class="lead">En maths, un calcul doit se lire <b>d'une seule façon</b>. S'il est mal écrit, on peut se tromper même en connaissant la méthode.</p><p class="lead">Dans ce cours, tu vas apprendre <b>4 règles d'écriture</b>.</p>` }));

add({ id: 'deux-roles', sec: 'Leçon', name: 'Le − a deux rôles',
  what: "Explique en trois temps que le signe − sert à deux choses : soustraire, et dire qu'un nombre est négatif.",
  why: "C'est l'idée qui manquait. Toutes les règles du cours viennent de là : les parenthèses servent à ne pas confondre les deux rôles. Les lignes apparaissent une par une avec « Suite », pour ne pas tout donner d'un coup.",
  ask: [] },
  reveal(`Le signe ${M} a deux rôles`, [
    { s: `<span style="font-size:4.5rem">${M}</span><span class="cap">Le même petit trait, deux sens différents.</span>`,
      t: `<p class="lead">Avant les règles, une chose à savoir sur le signe moins.</p>` },
    { s: `<div class="stage split" style="background:none;min-height:0;padding:0"><div>7 <span class="hl pin">${M}</span> 3<span class="lbl">soustraire</span></div><div style="opacity:.35">${M}3</div></div>`,

/* Classer, en glisser-déposer */
const CL = [
  { t: `4 × (${M}3)`, k: 'bien' },
  { t: `5 + ${M}2`, k: 'mal', fix: `5 + (${M}2), règle 1` },
  { t: `${M}3 + 5`, k: 'bien' },

add({ id: 'classer', sec: 'À toi', name: 'Classer (glisser)',
  what: "Elle fait glisser chaque calcul dans « Bien écrit » ou « Mal écrit ». Toucher un calcul puis une case marche aussi.",
  why: "La manière de faire est écrite dans la consigne. Après « Valider », chaque calcul mal écrit montre sa correction et le numéro de la règle.",
  ask: ["Pendant le tri, aucune couleur n'indique la bonne case. Les couleurs n'apparaissent qu'après « Valider »."] },
  { init: () => ({ place: CL.map(() => null), sel: null, done: false }),
    render: (st) => {
      const tag = (i) => {
        const c = st.done ? (st.place[i] === CL[i].k ? 'ok' : 'ko') : st.sel === i ? 'sel' : '';
        const fix = st.done && CL[i].fix ? `<span class="fix">→ ${CL[i].fix}</span>` : '';
        return `<button class="tag ${c}" data-drag="${i}">${CL[i].t}${fix}</button>`;
      };
      let h = `<p class="lead"><b>Fais glisser chaque calcul</b> du bas de l'écran vers la bonne case.</p><p class="small">Tu peux aussi toucher un calcul, puis toucher la case.</p>`;
      h += `<div class="bins">`;
      for (const [k, label] of [['bien', 'Bien écrit'], ['mal', 'Mal écrit']])
        h += `<div class="bin" data-bin="${k}" data-a="drop" data-k="${k}"><h3>${label}</h3>${CL.map((_, i) => (st.place[i] === k ? tag(i) : '')).join('')}</div>`;
      h += '</div>';
      const left = CL.map((_, i) => (st.place[i] === null ? tag(i) : '')).join('');
      if (left) h += `<div class="zone"><p class="small">À ranger :</p><div class="tags">${left}</div></div>`;
      if (st.done) {
        const n = st.place.filter((p, i) => p === CL[i].k).length;
        h += n === CL.length ? fb('ok', 'Tout est bien classé !') : fb('ko', `${n} sur ${CL.length} bien classés.`, 'Regarde les corrections sous les calculs mal écrits.');
      }
      return h;
    },
    foot: (st) => (st.done ? { label: 'Continuer', a: 'next' } : { label: 'Valider', a: 'check', off: st.place.some((p) => p === null) }),
    on: (a, d, st) => {
      if (st.done) return;
      if (a === 'tap') st.sel = st.sel === +d.i ? null : +d.i;
      if (a === 'drop' && st.sel !== null) { st.place[st.sel] = d.k; st.sel = null; }
      if (a === 'dragdrop') { st.place[+d.i] = d.k; st.sel = null; }
      if (a === 'check') st.done = true;
    } });

add({ id: 'guide-1', sec: 'Exemple guidé 1 sur 2', name: 'Réécrire 6 × −2',
  what: "La consigne montre le calcul mal écrit, 6 × −2, et demande de le réécrire en entier. Le clavier est complet : chiffres, + − × ÷ et parenthèses.",
  why: "C'est la correction du gros défaut : avant, on ne voyait que « 6 × ( ▢ ) » et n'importe quel négatif semblait juste. Le clavier complet ne dicte pas la réponse. Chaque erreur fréquente a son message, et « Étape par étape » montre vraiment des étapes.",
  ask: ["Je propose de taper le calcul entier plutôt que de remplir une case. C'est plus proche d'un contrôle. Ça te va ?"] },
  typed({ consigne: 'Ce calcul est mal écrit. <b>Réécris-le correctement.</b>', given: `6 × ${M}2`,
    steps: ['Repère les deux signes qui se touchent : × et −.', 'Mets le nombre négatif entre parenthèses : (−2).', 'Le calcul bien écrit : 6 × (−2).'],
    check: (v) => {
      const s = v.replace(/\s/g, '');
      if (s === '6×(−2)') return { ok: true, msg: 'Le × et le − ne se touchent plus.' };
      if (s === '6×−2') return { ok: false, msg: 'Le × et le − se touchent encore. Mets −2 entre parenthèses.' };
      if (s === '6×(−2') return { ok: false, msg: 'La parenthèse ouverte doit se fermer.' };
      if (s === '6×(2−)' || s === '6×2−') return { ok: false, msg: 'Le signe − se met avant le 2.' };
      if (/^6×\(−\d+\)$/.test(s)) return { ok: false, msg: "L'écriture est bonne, mais le nombre a changé. Garde −2." };
      if (s === '(6×−2)') return { ok: false, msg: 'Les parenthèses doivent entourer le nombre négatif, pas tout le calcul.' };
      return { ok: false, msg: 'Garde le même calcul, et mets le nombre négatif entre parenthèses.' };
    } }));

`;
      if (done) h += good ? fb('ok', 'Juste !', `Deux signes se touchent : ${M} et ${M}2. On écrit ${M}6 ${M} (${M}2) × 4.`)
        : fb('ko', 'Pas tout à fait.', `La faute est ici : le ${M} de la soustraction touche le ${M} de ${M}2 (règle 1). On écrit ${M}6 ${M} (${M}2) × 4.`);
      h += `<div class="zone"><div class="pieces">${GL.map((g, i) => `<button class="piece ${done && (i === 2 || i === 3) ? 'ok' : done && i === st.p ? 'ko' : ''}" data-a="g" data-i="${i}" ${done ? 'disabled' : ''}>${g}</button>`).join('')}</div>
        <button class="btn btn-line ${done && st.p === -1 ? '' : ''}" data-a="g" data-i="-1" ${done ? 'disabled' : ''}>Tout est bien écrit</button></div>`;
      return h;
    },
    foot: (st) => ({ label: 'Continuer', a: 'next', off: st.p === undefined }),
    on: (a, d, st) => { if (a === 'g' && st.p === undefined) st.p = +d.i; } });

add({ id: 'resultat', sec: 'Résultat', name: 'Cours raté',
  what: "Dit ce qui s'est passé, avec des chiffres : bonnes réponses, exercices de fin, et les erreurs par règle avec un lien pour relire cette règle.",
  why: "Avant, on ne comprenait pas pourquoi il fallait faire une série de validation. Ici elle voit ce qui a manqué et quoi relire. La série de validation est présentée comme l'étape suivante, sans dramatiser.",
  ask: ["Lien « Relire la règle 1 » : il ouvre directement l'écran de cette règle, pas toute la leçon. D'accord ?"] },
  { init: () => ({}), foot: () => ({ label: 'Faire la série de validation', a: 'next' }), on() {},
    render: () => `<span class="num" aria-hidden="true">0</span><h2 class="t">Le cours 0 n'est pas encore validé</h2>
      <p class="lead">Voici ce qui s'est passé :</p>
      <div class="cond ko"><span class="ic">✗</span><p><b>10 bonnes réponses sur 14, soit 71 %.</b> Il en faut au moins 80 %.</p></div>
      <div class="cond ko"><span class="ic">✗</span><p><b>3 exercices de fin justes sur 5.</b> Il en faut au moins 4.</p></div>
      <p class="q">Tes erreurs :</p>
      <ul class="errs"><li><span>Deux signes qui se touchent (règle 1)</span><b>3 fois</b></li><li><span>Parenthèse non fermée (règle 4)</span><b>1 fois</b></li></ul>
      <p class="lead"><span class="link">Relire la règle 1</span></p>
      <p class="lead"><b>Prochaine étape : la série de validation.</b> 5 exercices, 4 justes pour valider le cours.</p>` });

add({ id: 'mes-cours', sec: 'Après', name: 'Mes cours après échec',
  what: "La fiche du cours dans « Mes cours » et sur l'accueil garde la raison de l'échec.",
  why: "Quand elle revient plus tard, elle sait encore ce qui lui manque, sans avoir dû retenir l'écran de résultat.",
  ask: [] },
  { init: () => ({}), foot: () => ({ label: 'Revenir au début', a: 'home' }), on() {},
    render: () => `<h2 class="t">Mes cours</h2>
      <div class="card"><div style="display:flex;gap:12px;align-items:center"><span class="num">0</span><div><b>Cours 0, bien écrire un calcul</b><br><span class="small" style="color:var(--ko)">À valider</span></div></div>
      <p class="small">Dernier essai : 3 exercices de fin justes sur 5. À revoir : <b>deux signes qui se touchent</b>.</p>
      <button class="btn btn-main" type="button">Faire la série de validation</button>
      <p class="lead" style="text-align:center"><span class="link">Relire la règle 1</span> · <span class="link">Relire la leçon</span></p></div>` });

/* ——— Notes générales ——— */
const GLOBAL = `
<section><h3>Ce que doit être un bon cours (brouillon du futur skill)</h3><ul>
<li><b>Une idée par écran.</b> Les lignes apparaissent une par une avec « Suite ».</li>
<li><b>L'écran n'est jamais vide.</b> Un grand calcul (la « scène ») occupe le haut dès le départ et se transforme à chaque étape. Les phrases s'ajoutent en dessous, les anciennes passent en gris.</li>
<li><b>De vraies phrases.</b> Elles disent quoi faire et pourquoi. Comprendre une consigne fait partie de l'apprentissage.</li>
<li><b>Expliquer le pourquoi avant la règle</b> (ici : le − a deux rôles).</li>
<li><b>Montrer, puis faire faire.</b> Après chaque règle, une petite question à toucher. Parfois avant, pour deviner, sans note.</li>
<li><b>Chaque erreur a son explication</b>, jamais une phrase générale.</li>
<li><b>La manière de répondre est écrite</b> (glisser, toucher, taper).</li>
<li><b>Ce qu'on touche est en bas de l'écran</b>, sous le pouce : choix, cases, clavier. Le calcul et les explications restent en haut.</li>
<li><b>Les exemples guidés</b> montrent le calcul de départ et demandent une vraie action. Le clavier complet ne dicte pas la réponse.</li>
<li><b>La fin annonce l'enjeu</b>, et le résultat explique avec des chiffres ce qui a manqué.</li>
</ul></section>
<section><h3>Règle des couleurs proposée</h3><div class="legend">
<div><span class="sw" style="background:var(--hl)"></span><span><b>Surligneur jaune</b> = « regarde ici ». Uniquement dans les explications.</span></div>
<div><span class="sw" style="background:var(--ok-bg);border-color:var(--ok)"></span><span><b>Vert</b> = juste, <b>après</b> une réponse.</span></div>
<div><span class="sw" style="background:var(--ko-bg);border-color:var(--ko)"></span><span><b>Rouge</b> = faux, <b>après</b> une réponse. Jamais pour colorer un nombre négatif.</span></div>
<div><span class="sw" style="background:var(--surface)"></span><span><b>Pendant une question : aucune couleur qui donne un indice.</b></span></div>
</div><p style="margin-top:10px" class="small">Le doc 06 prévoyait les négatifs en rouge et les positifs en bleu. Dans le Cours 0, je propose de ne pas colorer les nombres selon leur signe : ça ne sert pas ici, et le rouge se confondait avec les erreurs. On en reparlera pour les cours 1 à 7.</p></section>`;

/* ——— Moteur ——— */
let idx = 0;
const states = S.map((s) => s.init());

function renderNav() {
  $('#nav').innerHTML = S.map((s, i) => `<button class="${i === idx ? 'on' : ''}" data-go="${i}">${i + 1}. ${s.name}</button>`).join('');
}
function chipText(s, i) {
  if (s.sec === 'Leçon') {
    const lec = S.filter((x) => x.sec === 'Leçon');
    return `Cours 0 · Leçon · étape ${lec.indexOf(s) + 1} sur ${lec.length}`;
  }
  return `Cours 0 · ${s.sec}`;
}
function render() {
  const s = S[idx], st = states[idx];
  const f = s.foot(st);
  $('#phone').innerHTML = `
    <div class="ph-top"><span class="ph-x" aria-hidden="true">✕</span><div class="bar">${S.slice(0, 18).map((_, i) => `<i class="${i < idx ? 'd' : i === idx ? 'c' : ''}"></i>`).join('')}</div></div>
    <span class="chip">${chipText(s, idx)}</span>
    <div class="ph-body">${s.render(st)}</div>
    <div class="ph-foot"><button class="btn btn-main" data-a="${f.a}" ${f.off ? 'disabled' : ''}>${f.label}</button></div>`;
  const ask = s.ask.length ? `<section class="ask"><h3>À décider</h3><ul>${s.ask.map((a) => `<li>${a}</li>`).join('')}</ul></section>` : '';
  $('#notes').innerHTML = `
    <section><h3>Écran ${idx + 1} sur ${S.length} · ${s.name}</h3><p>${s.what}</p><p><b>Pourquoi :</b> ${s.why}</p>
      <div class="pager"><button data-go="${Math.max(0, idx - 1)}">← Écran précédent</button><button data-go="${Math.min(S.length - 1, idx + 1)}">Écran suivant →</button><button data-reset>Recommencer l'écran</button></div></section>
    ${ask}${GLOBAL}`;
  renderNav();
}
function go(i) { idx = i; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

document.addEventListener('click', (e) => {
  const g = e.target.closest('[data-go]');
  if (g) return go(+g.dataset.go);
  if (e.target.closest('[data-reset]')) { states[idx] = S[idx].init(); return render(); }
  if (e.target.closest('[data-drag]')) return; // géré par le glisser-déposer
  const el = e.target.closest('#phone [data-a]');
  if (!el || el.disabled) return;
  const a = el.dataset.a;
  if (a === 'next') return go(Math.min(S.length - 1, idx + 1));
  if (a === 'home') { S.forEach((s, i) => (states[i] = s.init())); return go(0); }
  S[idx].on(a, el.dataset, states[idx]);
  render();
});

/* Glisser-déposer (pointeur) avec repli au toucher */
let drag = null;
document.addEventListener('pointerdown', (e) => {
  const t = e.target.closest('[data-drag]');
  if (!t || states[idx].done) return;
  drag = { i: t.dataset.drag, x: e.clientX, y: e.clientY, el: t, ghost: null };
});
document.addEventListener('pointermove', (e) => {
  if (!drag) return;
  if (!drag.ghost && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 8) {
    drag.ghost = drag.el.cloneNode(true); drag.ghost.classList.add('ghost'); document.body.appendChild(drag.ghost);
    drag.el.style.opacity = '.3';
  }
  if (drag.ghost) {
    drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px';
    document.querySelectorAll('.bin').forEach((b) => b.classList.remove('over'));
    const under = document.elementFromPoint(e.clientX, e.clientY)?.closest('.bin');
    if (under) under.classList.add('over');
  }
});
document.addEventListener('pointerup', (e) => {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.ghost) {
    d.ghost.remove();
    const under = document.elementFromPoint(e.clientX, e.clientY)?.closest('.bin');
    if (under) S[idx].on('dragdrop', { i: d.i, k: under.dataset.bin }, states[idx]);
  } else {
    S[idx].on('tap', { i: d.i }, states[idx]);
  }
  render();
});
document.addEventListener('pointercancel', () => { if (drag?.ghost) drag.ghost.remove(); drag = null; render(); });

render();
</script>
